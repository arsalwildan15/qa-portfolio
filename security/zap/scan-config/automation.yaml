---
env:
  contexts:
    - name: "OrangeHRM Context"
      urls:
        - "http://localhost:8080"
      includePaths:
        - "http://localhost:8080.*"
      excludePaths:
        - "http://localhost:8080/web/index.php/auth/logout.*"
      authentication:
        method: "form"
        parameters:
          loginPageUrl: "http://localhost:8080/web/index.php/auth/login"
          loginRequestUrl: "http://localhost:8080/web/index.php/auth/validateCredentials"
          loginRequestBody: "_username={%username%}&_password={%password%}"
        verification:
          method: "response"
          loggedInRegex: "dashboard"
          loggedOutRegex: "auth/login"
      sessionManagement:
        method: "cookie"
      users:
        - name: "Admin"
          credentials:
            username: "Admin"
            password: "admin123"

  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:

  # 1. Spider — discover all URLs
  - type: spider
    name: "Spider OrangeHRM"
    parameters:
      context: "OrangeHRM Context"
      user: "Admin"
      maxDuration: 5
      maxDepth: 5
      acceptCookies: true

  # 2. AJAX Spider — discover JS-rendered URLs
  - type: spiderAjax
    name: "Ajax Spider OrangeHRM"
    parameters:
      context: "OrangeHRM Context"
      user: "Admin"
      maxDuration: 3

  # 3. Active Scan — attack simulation (authenticated)
  - type: activeScan
    name: "Active Scan - Authenticated"
    parameters:
      context: "OrangeHRM Context"
      user: "Admin"
      policy: "Default Policy"
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 60

  # 4. Report — HTML output
  - type: report
    name: "Generate HTML Report"
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-report-orangehrm-auth"
      reportTitle: "ZAP DAST Report — OrangeHRM (Authenticated)"
      reportDescription: "Portfolio security scan — OrangeHRM self-hosted via Docker"
      displayReport: false

  # 5. Report — JSON output (for CI parsing)
  - type: report
    name: "Generate JSON Report"
    parameters:
      template: "json"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-report-orangehrm-auth"
